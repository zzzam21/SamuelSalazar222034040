<!-- El paginador es que cada cierto numero va a crear una pagina -->
<p-table [value]="users" [paginator]="true" [rows]="5" responsiveLayout="'scroll'">
    <ng-template pTemplate="header">
        <tr>
            <th>ID</th>
            <th>Usuario</th>
            <th>Contraseña</th>
            <th>Acciones</th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-user>
        <tr>
            <td>{{ user.id }}</td>
            <td>{{ user.username }}</td>
            <td>{{ user.password }}</td>
            <button pButton label="Editar" class="p-button-sm p-button-warning"></button>
            <button pButton label="Eliminar" class="p-button-sm p-button-danger"></button>
        </tr>
    </ng-template>
</p-table>
